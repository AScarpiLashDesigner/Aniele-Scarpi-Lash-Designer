<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar horário | Aniele Scarpi</title><style>:root{font-family:Poppins,Arial,sans-serif;color:#513d38;background:#faf6f5}*{box-sizing:border-box}body{margin:0}header{text-align:center;padding:36px 16px 15px}h1{font-family:Georgia,serif;font-size:32px;margin:10px}main{max-width:570px;margin:16px auto 50px;padding:0 16px}.card{background:white;border:1px solid #ecdedb;border-radius:18px;padding:24px;box-shadow:0 10px 30px #442a2010}label{display:block;font-weight:600;margin:16px 0 7px}input,select{width:100%;font:inherit;padding:13px;border:1px solid #d6c2bd;border-radius:9px;background:white}button{font:inherit;background:#694a42;color:white;border:0;border-radius:9px;padding:14px 20px;cursor:pointer;width:100%;margin-top:20px}button:disabled{opacity:.5}.muted{color:#766a67;line-height:1.5}.success{color:#276c4a}.error{color:#a12626}a{color:#694a42}#message{min-height:25px}</style></head><body><header><p>ANIELE SCARPI · LASH DESIGNER</p><h1>Seu próximo olhar começa aqui</h1><p class="muted">Toledo · MG</p></header><main><div class="card"><h2>Solicitar agendamento</h2><p class="muted">Escolha uma data e um horário. Seu agendamento só estará confirmado após nossa aprovação pelo WhatsApp.</p><form id="form"><label for="nome">Nome completo</label><input id="nome" required maxlength="120" autocomplete="name"><label for="whatsapp">WhatsApp com DDD</label><input id="whatsapp" type="tel" required inputmode="tel" maxlength="20" placeholder="(35) 99999-9999"><label for="tecnica">Técnica desejada</label><select id="tecnica" required><option value="">Selecione</option><option>Fio a fio</option><option>Volume Brasileiro</option><option>Volume Egípcio</option><option>Volume Inglês</option><option>Volume Luxo</option><option>Volume Wispy</option><option>Efeito Fox Eyes</option><option>Efeito Molhado</option><option>Outra técnica / avaliação</option></select><label for="date">Data disponível</label><select id="date" required><option value="">Carregando datas...</option></select><label for="time">Horário disponível</label><select id="time" required><option value="">Escolha a data primeiro</option></select><button id="submit" disabled>Solicitar agendamento</button><p id="message" role="status"></p></form><p class="muted">Se precisar de ajuda, <a href="https://wa.me/5535991315723" target="_blank" rel="noopener">fale pelo WhatsApp</a>.</p></div></main><script>
const tecnicaParam=new URLSearchParams(window.location.search).get("tecnica");const tecnicaSelect=document.getElementById("tecnica");if(tecnicaParam){const match=Array.from(tecnicaSelect.options).find(o=>o.textContent.toLocaleLowerCase("pt-BR")===tecnicaParam.toLocaleLowerCase("pt-BR"));if(match)tecnicaSelect.value=match.value;}
const api="https://weotpmakhcifhjlujrsz.supabase.co/functions/v1/agendamento-publico",date=document.getElementById("date"),time=document.getElementById("time"),submit=document.getElementById("submit"),msg=document.getElementById("message");let days=[];
function fill(select,placeholder,values){select.replaceChildren();const first=document.createElement("option");first.value="";first.textContent=placeholder;select.append(first);for(const [value,label] of values){const option=document.createElement("option");option.value=value;option.textContent=label;select.append(option)}}
function showSlots(){const d=days.find(d=>d.date===date.value);fill(time,d?"Selecione um horário":"Escolha a data primeiro",(d?.slots||[]).map(t=>[t,t]));submit.disabled=!d}
async function load(){try{const res=await fetch(api,{cache:"no-store"});const json=await res.json();if(!res.ok)throw Error(json.error||"Não foi possível carregar");days=json.days||[];fill(date,days.length?"Selecione a data":"Sem horários disponíveis",days.map(d=>[d.date,new Date(d.date+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})]));showSlots()}catch(e){msg.className="error";msg.textContent=e.message;fill(date,"Horários temporariamente indisponíveis",[])}}
date.onchange=showSlots;document.getElementById("form").onsubmit=async e=>{e.preventDefault();submit.disabled=true;msg.textContent="Enviando solicitação...";try{const body={nome:document.getElementById("nome").value,whatsapp:document.getElementById("whatsapp").value,tecnica:document.getElementById("tecnica").value,date:date.value,time:time.value};const res=await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const json=await res.json();if(!res.ok)throw Error(json.error||"Erro ao solicitar");msg.className="success";msg.textContent=json.message;document.getElementById("form").reset();await load()}catch(err){msg.className="error";msg.textContent=err.message}finally{submit.disabled=false}};load();
</script></body></html>

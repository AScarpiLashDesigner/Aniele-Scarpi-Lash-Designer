<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Agenda privada do estúdio Aniele Scarpi Lash Designer"><title>Agenda | Aniele Scarpi</title><link rel="stylesheet" href="./app.css"></head><body><div id="root"></div><style>
#integrated-clients{display:none;position:fixed;z-index:50;top:75px;right:0;bottom:0;left:236px;background:#faf8f6}
#integrated-clients iframe{width:100%;height:100%;border:0;background:#faf8f6}

</style><div id="integrated-clients" aria-label="Cadastro e anamnese de clientes"><iframe title="Cadastro, anamnese e WhatsApp das clientes" src="./clientes.html" loading="lazy"></iframe></div>
<script>
(function(){
function update(){const active=document.querySelector("nav button.nav-active");const isClients=active&&active.textContent.trim()==="Clientes";document.body.classList.toggle("clients-integrated",!!isClients)}

})();

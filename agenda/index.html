<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Agenda privada do estúdio Aniele Scarpi Lash Designer"><title>Agenda | Aniele Scarpi</title><link rel="stylesheet" href="./app.css"><link rel="stylesheet" href="./menu-compacto.css?v=20261116-1"><link rel="stylesheet" href="./painel-inicial.css?v=20261116-1"><link rel="stylesheet" href="./inicio-organizado.css?v=20261116-1"><link rel="stylesheet" href="./horarios-livres.css?v=20261116-floral1"><link rel="stylesheet" href="./procedimentos.css?v=1"></head><body><div id="root"></div><script>
document.addEventListener("click",function(event){
const button=event.target.closest("button");
if(!button)return;
const active=document.querySelector("nav button.nav-active");
if(!active||active.textContent.trim()!=="Clientes")return;
if(button.textContent.trim()!=="Nova cliente")return;
event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
window.location.href="./clientes.html";
},true);
</script><style>
.as-previous-appointment{padding:13px;border:1px solid #ead8d5;border-radius:12px;background:#fcf6f3;overflow-wrap:anywhere}
.as-previous-appointment h3{margin:0 0 7px;color:#67483e;font-size:16px}
.as-previous-appointment p{margin:5px 0;white-space:pre-wrap}
.as-previous-appointment img{display:block;width:auto;max-width:100%;max-height:210px;object-fit:contain;margin-top:9px;border-radius:8px}
#as-ficha-backdrop{position:fixed;inset:0;background:#25191bcc;z-index:9998;display:none;align-items:center;justify-content:center;padding:14px}
#as-ficha-backdrop.visible{display:flex}#as-ficha-dialog{background:#fffaf9;color:#3f3032;border-radius:16px;max-width:610px;width:100%;max-height:90vh;overflow:auto;padding:25px;box-shadow:0 12px 40px #0004}
#as-ficha-dialog h2{margin:0 0 15px;font-family:Georgia,serif}#as-ficha-dialog p{margin:9px 0;line-height:1.55;overflow-wrap:anywhere}#as-ficha-dialog button,#as-ficha-dialog a.as-link{display:inline-block;padding:11px 14px;border-radius:8px;background:#67483e;color:white;text-decoration:none;margin:10px 8px 0 0}
</style><div id="as-ficha-backdrop"><section id="as-ficha-dialog" role="dialog" aria-modal="true" aria-label="Ficha da cliente"><button id="as-ficha-close" type="button">Fechar</button><h2>Ficha da cliente</h2><div id="as-ficha-content"></div><div id="as-ficha-history"></div><div id="as-ficha-anamnese"></div><div id="as-ficha-actions"></div></section></div>
<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2.57.0";
import {showProcedureHistory} from "./procedimentos.js?v=1";
import {installPreviousAppointment} from "./ultimo-atendimento.js?v=1";
const cfg=window.AS_AGENDA_CONFIG;
function agendaSession(){
  try{return JSON.parse(sessionStorage.getItem("as-agenda-session-v1")||"null")}
  catch{return null}
}
const db=createClient(cfg.url,cfg.key,{accessToken:async()=>agendaSession()?.access_token||null});
installPreviousAppointment(db,agendaSession,document.getElementById("root"));
const backdrop=document.getElementById("as-ficha-backdrop"),content=document.getElementById("as-ficha-content"),actions=document.getElementById("as-ficha-actions");
const history=document.getElementById("as-ficha-history"), anam=document.getElementById("as-ficha-anamnese");
let fichaRequest=0;
function add(label,value,target=content){const p=document.createElement("p"),b=document.createElement("strong");b.textContent=label+": ";p.append(b,document.createTextNode(value==null||value===""?"Não informado":String(value)));target.append(p);return p}
function close(){fichaRequest++;backdrop.classList.remove("visible");history.replaceChildren();anam.replaceChildren();content.replaceChildren();actions.replaceChildren()}
window.addEventListener("agenda-session-expired",close);
document.getElementById("as-ficha-close").onclick=close;backdrop.addEventListener("click",e=>{if(e.target===backdrop)close()});
const labels={ja_fez_extensao:"Já fez extensão",ultimo_procedimento:"Último procedimento",reacao_anterior:"Reação anterior",alergia_conhecida:"Alergia conhecida",qual_alergia:"Qual alergia",lentes_contato:"Lentes de contato",tratamento_medico:"Tratamento médico",medicamento_continuo:"Medicamento contínuo",qual_medicamento:"Qual medicamento",gestante_amamentando:"Grávida ou amamentando",condicao_ocular:"Condição ocular",qual_condicao:"Qual condição",irritacao_ocular:"Irritação ocular",cirurgia_ocular:"Cirurgia ocular recente",observacoes_saude:"Observações de saúde",informacoes_verdadeiras:"Declaração de veracidade",ciente_riscos:"Ciência dos riscos",autoriza_procedimento:"Autorização do procedimento",autoriza_imagens:"Autorização de imagens",observacoes_adicionais:"Observações adicionais"};

window.AS_openFicha=async function(client){
close();
const request=fichaRequest;
backdrop.classList.add("visible");
add("Nome",client.name);add("WhatsApp",client.phone);add("Prazo de manutenção",client.days+" dias");add("Observações da agenda",client.notes);
const loading=add("Anamnese","Carregando...",anam);
try{
const session=agendaSession();
const user=session?.user;
if(!user?.id||!session.access_token)throw Error("Entre na agenda novamente.");
void showProcedureHistory(db,history,client,user);
const digits=v=>String(v||"").replace(/\D/g,"");
const {data,error}=await db.from("clientes_studio").select("id,nome,whatsapp,nascimento,instagram,tecnica_desejada,observacoes_internas,anamnese,anamnese_at").eq("owner_id",user.id);
if(request!==fichaRequest)return;
if(error)throw error;
const rows=data||[];
const matches=rows.filter(r=>digits(r.whatsapp).length>=10&&digits(r.whatsapp)===digits(client.phone));
const row=rows.find(r=>r.id===client.id)||(matches.length===1?matches[0]:null);
loading.remove();
const a=document.createElement("a");a.className="as-link";
if(!row){
add("Anamnese","Ainda não cadastrada na ficha digital.",anam);
a.href="./clientes.html";a.textContent="Completar cadastro e anamnese";actions.append(a);return;
}
add("Nascimento",row.nascimento);add("Instagram",row.instagram);add("Técnica desejada",row.tecnica_desejada);add("Observações internas",row.observacoes_internas);add("Anamnese",row.anamnese_at?"Preenchida":"Pendente",anam);
if(row.anamnese)for(const [k,v] of Object.entries(row.anamnese))add(labels[k]||k,v,anam);
a.href="./clientes.html?cliente="+encodeURIComponent(row.id);a.textContent="Editar ficha e enviar WhatsApp";actions.append(a);
}catch(err){if(request===fichaRequest){loading.remove();add("Erro ao consultar",err.message||"Tente novamente",anam)}}
};
</script><script>
(function(){function install(){const nav=document.querySelector("nav");if(!nav||document.getElementById("as-online-requests"))return;const b=document.createElement("button");b.id="as-online-requests";b.type="button";b.textContent="✉ Solicitações online";b.onclick=()=>location.href="./solicitacoes.html";nav.append(b)}new MutationObserver(install).observe(document.getElementById("root"),{childList:true,subtree:true});install()})();
</script><script>(function(){function install(){const nav=document.querySelector("nav");if(!nav||document.getElementById("as-finance-nav"))return;const b=document.createElement("button");b.type="button";b.id="as-finance-nav";b.textContent="R$ Financeiro";b.onclick=()=>location.href="./financeiro.html";nav.append(b)}new MutationObserver(install).observe(document.getElementById("root"),{childList:true,subtree:true});install()})();</script><noscript>Ative o JavaScript para abrir a agenda.</noscript><script src="./config.js"></script><script src="./excluir-cliente.js?v=20261117-1"></script><script type="module" src="./app.js?v=20261118-acoes-procedimento1"></script><script src="./manutencoes.js?v=20261116-retorno2" defer></script><script src="./desempenho.js?v=20261116-parceria3" defer></script><script src="./pos-atendimento.js?v=20261116-contatos2" defer></script><script src="./painel-inicial.js?v=20261118-concluido1" defer></script><script src="./horarios-livres.js?v=20261117-meiahora1" defer></script><script src="./avaliacoes-nav.js?v=20261116-1" defer></script><script src="../site-privacidade.js?v=20261117-2" defer></script><script src="./acessos-nav.js?v=20261117-2" defer></script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solicitações | Aniele Scarpi</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f6;color:#49352f;font:15px Arial,sans-serif}header{padding:20px;background:white;border-bottom:1px solid #e8dbd7;display:flex;justify-content:space-between;gap:12px}main{max-width:850px;margin:30px auto;padding:0 15px}h1{font:30px Georgia,serif}.card{background:white;border:1px solid #ebdcd7;border-radius:13px;padding:18px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button{padding:11px 15px;background:#68483d;color:white;border:0;border-radius:8px;cursor:pointer}button.secondary{background:#f2e9e5;color:#68483d}button:disabled{opacity:.5}.whatsapp-confirmar{display:inline-flex;align-items:center;gap:8px;background:#e8f3ec;color:#246543;border:1px solid #bad9c7;border-radius:9px;padding:11px 14px;text-decoration:none;font-weight:600;margin-top:12px}.whatsapp-confirmar:hover{background:#d9eadd}.card p{line-height:1.55}a{color:#68483d}.muted{color:#7d6f6a}.error{color:#aa2929}</style></head><body><header><strong>Aniele Scarpi | Solicitações online</strong><a href="./">Voltar à agenda</a></header><main><div class="row"><h1>Pedidos de agendamento</h1><button id="reload">Atualizar</button></div><p class="muted">Os pedidos não bloqueiam definitivamente a agenda até serem aprovados. Confira os dados e aprove ou recuse. A aprovação cria o atendimento diretamente na agenda.</p><p id="status" role="status"></p><div id="list"></div></main><script>
</script><script src="./config.js"></script><script>
const cfg=window.AS_AGENDA_CONFIG;
const statusEl=document.getElementById("status"),list=document.getElementById("list");
function session(){try{return JSON.parse(sessionStorage.getItem("as-agenda-session-v1")||"null")}catch{return null}}
async function request(path,opts={}){const s=session();if(!s?.access_token||!s?.user?.id)throw Error("Entre primeiro na agenda principal.");const response=await fetch(cfg.url+"/rest/v1/"+path,{...opts,headers:{apikey:cfg.key,Authorization:"Bearer "+s.access_token,"Content-Type":"application/json",...opts.headers},cache:"no-store"});const json=await response.json().catch(()=>null);if(!response.ok)throw Error(json?.message||json?.error||"Erro ao consultar o banco");return json}
function p(parent,text){const node=document.createElement("p");node.textContent=text;parent.append(node)}
function confirmationLink(r){const digits=String(r.whatsapp||"").replace(/\D/g,"");const phone=digits.startsWith("55")?digits:"55"+digits;const data=String(r.data||"").split("-").reverse().join("/");const hora=String(r.horario||"").slice(0,5);const nome=String(r.nome||"").trim().split(/\s+/)[0]||"cliente";const mensagem="Olá, "+nome+"! 💗 Seu agendamento com Aniele Scarpi | Lash Designer está confirmado!\n\n✨ Técnica: "+r.tecnica+"\n📅 Data: "+data+"\n🕒 Horário: "+hora+"\n\nPara se preparar, confira as orientações antes do atendimento:\nhttps://ascarpilashdesigner.github.io/Aniele-Scarpi-Lash-Designer/#preparacao\n\nTe espero! 💕";return "https://wa.me/"+phone+"?text="+encodeURIComponent(mensagem)}
function addConfirmationButton(card,r){const a=document.createElement("a");a.className="whatsapp-confirmar";a.href=confirmationLink(r);a.target="_blank";a.rel="noopener noreferrer";a.textContent="✉ Enviar confirmação e orientações pelo WhatsApp";card.append(a)}

async function load(){statusEl.textContent="Carregando solicitações...";list.replaceChildren();try{const s=session();const data=await request("solicitacoes_agendamento?owner_id=eq."+encodeURIComponent(s.user.id)+"&select=id,nome,whatsapp,tecnica,data,horario,status,created_at&order=created_at.desc&limit=100");const pending=data.filter(x=>x.status==="pendente");statusEl.textContent=pending.length+" solicitação(ões) pendente(s) · "+data.length+" registro(s) recente(s)";if(!data.length)p(list,"Nenhuma solicitação recebida ainda.");for(const r of data){const card=document.createElement("div");card.className="card";const title=document.createElement("strong");title.textContent=r.nome;card.append(title);p(card,r.data.split("-").reverse().join("/")+" às "+r.horario.slice(0,5)+" · "+r.tecnica);p(card,"WhatsApp: "+r.whatsapp+" · "+(r.status==="pendente"?"Aguardando decisão":r.status));if(r.status==="pendente"){const buttons=document.createElement("div");buttons.className="row";for(const [yes,label] of [[true,"Aprovar e incluir na agenda"],[false,"Recusar pedido"]]){const btn=document.createElement("button");btn.textContent=label;btn.className=yes?"":"secondary";btn.onclick=async()=>{if(!confirm((yes?"Aprovar":"Recusar")+" o pedido de "+r.nome+"?"))return;btn.disabled=true;try{const result=await request("rpc/decidir_solicitacao",{method:"POST",body:JSON.stringify({p_id:r.id,p_aprovar:yes})});if(yes){alert("Atendimento adicionado à agenda! Você já pode enviar a confirmação pelo WhatsApp.");await load()}else{alert("Solicitação recusada.");await load()}}catch(e){alert(e.message);btn.disabled=false}};buttons.append(btn)}card.append(buttons)}if(["aprovado","aprovada","aprovado_na_agenda"].includes(r.status))addConfirmationButton(card,r);list.append(card)}}catch(e){statusEl.className="error";statusEl.textContent=e.message}}
document.getElementById("reload").onclick=load;load();
</script></body></html>
